# =============================================================================
# Bots-EDI v4 configuration
# =============================================================================
#
# Configuration file for Bots.
# Note that there is also a file 'settings.py' with (Django) configuration.
#
# The configuration file consists of sections, led by a "[section]" header
# and followed by "name = value" entries, with continuations in the style
# of RFC 822. "name: value" is also accepted.
#
# Note that leading whitespace is removed from values.
# Lines beginning with "#" or ";" are ignored and may be used for comments.
#
# =============================================================================



[settings]

# -----------------------------------------------------------------------------
# General settings
# -----------------------------------------------------------------------------


# Number of days reports and traces are kept.
# Default: 30 days
maxdays = 30

# Number of days files in archive are kept.
# Default: 180 days
maxdaysarchive = 180

# Archive to ZIP files instead of directories.
# Default: False
archivezip = False

# Archive using the external name of the file.
# Does not work for all types of communication, as there is not always a filename.
# Default: False
archiveexternalname = False

# Number of HOURS reports and traces are kept for runs without input
# (with no EDI files received). 
# Default: 24 hours
hoursrunwithoutresultiskept = 24

# Number of days persistent data are kept in the database.
# Default: 30 days
maxdayspersist = 30

# Number of minutes the bots-engine is allowed to run.
# If another instance of bots-engine is started, it will not end in error before
# this timeout is reached.
# Default: 60 minutes
maxruntime = 60

# Number of reports/orders displayed on one screen.
# Default: 30
limit = 30

# Number of lines displayed on one screen for configuration items.
# Default: value of 'limit'
adminlimit = 30

# Interchange control reference (counter): per receiver if True; per sender if False.
# Default: False  (unique counter per sender)
interchangecontrolperpartner = False

# Display incoming messages with multiple values:
#   True  = display '*'
#   False = display the first encountered value
# Default: True
multiplevaluesasterisk = True

# How often cleanup is performed:
#   daily  = at the first run of the day
#   never  = cleanup is scheduled manually
# Default: daily
whencleanup = daily


# -----------------------------------------------------------------------------
# File and communication limits
# -----------------------------------------------------------------------------

# Maximum size of incoming EDI files, in bytes.
# Files larger than this size are not translated and result in an error.
#
# Reason: the engine might run for too long; also check available RAM.
#
# Notes:
#   - An EDI file containing multiple interchanges (EDIFACT, X12) is first
#     split into separate interchanges.
#   - EDI files up to 10 MB are processed without problems on a computer with 4 GB RAM.
#   - EDI files are generally not very large. Actually I have never seen an EDI file of 5 MB...
#
# Default: 5000000 (5 MB)
maxfilesizeincoming = 5000000

# Maximum time spent in-communication with an incoming channel, in seconds.
# This is the global parameter and can also be limited per channel in the GUI.
# Default: 60 seconds
maxsecondsperchannel = 60

# Keep all channels on this machine (a test environment): every channel uses its
# 'testpath' (a folder; ftp, sftp, database etc. become a folder, mail a mime file).
# A channel that would connect to another machine and has no testpath is not run
# (an error). Unlike runacceptancetest the clock and counters are not frozen.
# bots-portenv --local-folders sets this and gives every channel a testpath.
# Default: False
# channels_use_testpath = False

# x12: version of a 997 that bots makes itself (no mapping script for the 997).
# False: always grammar 997004010, as bots 3.
# True: the version in GS08 of the received group, if usersys has a 997 grammar
#       for that version (eg 997004060); otherwise 997004010.
# Default: False
# x12_997_version_as_received = False

# Maximum number of errors reported for incoming files.
# If this number is reached, parsing stops and errors are reported.
# Note: some errors cause parsing to end immediately.
# Default: 10
max_number_errors = 10


# -----------------------------------------------------------------------------
# Compatibility settings
# -----------------------------------------------------------------------------

# Compatibility mode for Bots <= 2.2.1:
# EDIFACT, X12 and Tradacoms message types did not use mailbag by default.
#
# Bots >= 3.0.0 use mailbag for EDIFACT, X12 and Tradacoms.
# Default: False (use mailbag).
compatibility_mailbag = False


# -----------------------------------------------------------------------------
# Engine and timeout settings
# -----------------------------------------------------------------------------

# Port used to ensure that only one instance of bots-engine is running.
# Default: 28081
port = 28081

# Global timeout for TCP/IP connections, in seconds.
# Default: 10
globaltimeout = 10

# (S)FTP-specific timeout, in seconds.
# Default: 10
ftptimeout = 10

# How many times Bots should try to connect in communication channel, before reporting error.
# This global setting is overwritten by channel setting in GUI.
# Defaults:
# - out-channel: 3,
# - in-channel: 0 (do not retry).
# maxconnectiontries = 3

# Replacement character to be used in incoming or outgoing messages, if a character
# is not available in the charset.
#
# To use this option, set the syntax parameters checkcharsetin and
# checkcharsetout to code 'botsreplace'.
#
# Default: space.
# 'space' cannot be set explicitly.
#
# botsreplacechar =


# -----------------------------------------------------------------------------
# Reporting
# -----------------------------------------------------------------------------

# Send a report by email if errors occurred.
# Default: False (never send)
sendreportiferror = False

# Send a report by email only if process errors occurred.
# Useful if outcommunication often gives errors.
# Default: True
sendreportifprocesserror = True


# -----------------------------------------------------------------------------
# Bots-engine logging
# -----------------------------------------------------------------------------

# Logging is always written to a log file and optionally to the console.
# Global Bots log_level (bots.engine, bots.engine2, bots.jobqueue, bots.dirmonitor, bots.webserver)
# takes precedence over Bots logger level handlers listed below (log_console_level, log_file_level). 
# Default: INFO
log_level = INFO

# Enable console logging.
# Default: True
log_console = True

# Console logging level.
# Note: global log_level takes precedence.
# Values: DEBUG, INFO, START, STARTINFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_console_level = INFO

# Log file logging level.
# Note: global log_level takes precedence.
# Values: DEBUG, INFO, START, STARTINFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_file_level = INFO

# When to create log files.
# Values: daily (rotated at midnight), report (each run uses its own log file)
# Default: report
# log_when = daily

# Number of rotating log files.
# This parameter is valid only for log_when = daily.
# Default: 30
log_file_number = 30


# -----------------------------------------------------------------------------
# Debug settings
# -----------------------------------------------------------------------------

# get_checklevel:
#   2 = include check of mpaths in get/getloop with grammar
#   1 = check mpaths in get/getloop for type, etc.
#   0 = no checks on mpaths (faster)
#
# Note: 
# Use get_checklevel=2 during development. In production use either 0 or 1.
# 0 is faster, but requires all get/getloops to be 100% correct.
get_checklevel = 1

# Include Python trace information in errors.
# Default: False
debug = False


# -----------------------------------------------------------------------------
# Mapping and record debugging
# -----------------------------------------------------------------------------

# Detailed information about records that are read (DEBUG level).
# Default: False
readrecorddebug = False

# Detailed information about mapping scripts (DEBUG level).
# Useful when developing mappings.
# Default: False
mappingdebug = False


# -----------------------------------------------------------------------------
# Communication debugging
# -----------------------------------------------------------------------------
#
# These options do not use the logging system; information is printed
# directly to the console.
#

# FTP debug level.
# Values: 0, 1, 2
# Default: 0 (no debug)
ftpdebug = 0

# SMTP debug level.
# Values: 0, 1
# Default: 0  (no debug)
smtpdebug = 0

# POP3 debug level.
# Values: 0, 1, 2
# Default: 0  (no debug)
pop3debug = 0

# IMAP4 debug level.
# Values: 0, 1, 2, 3, 4, 5
# Default: 0  (no debug)
imap4debug = 0

# HTTP debug level.
# Values: 0, 1, 2, 3, 4
# Note: if a channel configuration dictionary (channeldict) provides a 'debug' key
# (or via a custom communication script), its value takes precedence over this setting.
# Default: 0 (no debug, except communication errors and high-level transaction logs)
# httpdebug = 0

# -----------------------------------------------------------------------------
# Django
# -----------------------------------------------------------------------------

# Database used by bots-engine.
# Default: default
# django_db = default

# Use the django db connection.
# Default: False
# django_db_connection = False

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

# Include ccodes in plugins.
# Default: True
# codelists_in_plugin = True

[webserver]

# -----------------------------------------------------------------------------
# Webserver
# -----------------------------------------------------------------------------

# Webserver environment.
# Values: development, production
# Default: production
environment = production

# Port on which bots-GUI is served.
# Default: 8080
port = 8080

# Touchscreen interface
# Note: this option was used to adapt GUI to small touchscreens, but it is already 
# replaced by responsive UI (CSS3). This option is DEPRECATED and will be removed.
# Default: False
# bots_touchscreen = False

# Use less strict email address validator.
# Django's email validating is to strict: eg if quoted user part, space is not allowed.
# Use case: x400 via IPmail (x400 addresses are used in email-addresses).
# Default: True (less strict validator)
# validate_email_address = True


# -----------------------------------------------------------------------------
# Webserver logging
# -----------------------------------------------------------------------------

# Logging is always written to a log file and optionally to the console.
log_level = INFO

# Enable console logging.
# Default: True
log_console = True

# Console logging level.
# Values: DEBUG, INFO, STARTINFO, WARNING, ERROR, CRITICAL
# Default: STARTINFO
log_console_level = STARTINFO

# Log file logging level.
# Values: DEBUG, INFO, STARTINFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_file_level = INFO

# Enable CherryPy access logging.
# Default: False
log_cherrypy_access = False

# Number of webserver daily rotating log files.
# Default: 30
# log_file_number = 30


# -----------------------------------------------------------------------------
# SSL / HTTPS
# -----------------------------------------------------------------------------

# To use SSL/HTTPS:
#   1. Specify the SSL certificate and private key (both can be in the same file).
#   2. Uncomment the following lines.
#
# Self-signed certificates are allowed.
#
# ssl_certificate = /path/to/filename
# ssl_private_key = /path/to/filename


# -----------------------------------------------------------------------------
# Webserver customization
# -----------------------------------------------------------------------------

# Customize the bots logo HTML file.
# Default: bots/botslogo.html
botslogo = bots/botslogo.html

# Customize the bots menu HTML file.
# Default: bots/menu.html
botsmenu = bots/menu.html

# Text displayed on the right of the bots logo.
# Useful to distinguish environments, e.g. TEST / PRODUCTION.
# Default: no text
environment_text =

# Own title in the About screen, instead of "Bots Open Source EDI Translator".
# Default: no own title
# about_title = EDI Admin Monitor

# Own support link in the About screen (http, https or mailto), instead of the
# links to the bots documentation, the project website and commercial support.
# support_text is the text of the link (default: Support).
# Default: no own link
# support_url = https://support.example.com
# support_text = Support desk

# Own logo (top left) and favicon: image files (png, gif, jpg, svg, ico; at most 512 kB).
# A relative path is relative to this config directory.
# Default: the logo and icon of bots
# logo_image = branding/logo.png
# favicon_image = branding/favicon.ico

# HTML-valid color name or #RGB value.
# Default: primary theme color
#
# environment_text_color = Red
# environment_text_color = #f00

# Valid CSS syntax.
# Overrides environment_text_color. 
# Examples: 
# environment_text_style = color:#acba03;font-size:2em;font-weight:normal;
# environment_text_style = color:#000;


# -----------------------------------------------------------------------------
# Menu
# -----------------------------------------------------------------------------

# Add automaticretrycommunication to the Run menu.
# Default: False
menu_automaticretrycommunication = True

# Add cleanup to the Run menu.
# Default: False
menu_cleanup = True

# Show Change Password in the Home menu.
# Default: True
menu_changepassword = True

# Routes displayed in the Run menu:
#   True             = show all routes individually
#   notindefaultrun  = show only routes not in the default run
#   False            = no additional route entries
#
# Default: notindefaultrun
menu_all_routes = notindefaultrun


# -----------------------------------------------------------------------------
# Filer
# -----------------------------------------------------------------------------

# Maximum Python file size displayed in /srfiler.
max_src_size = 5000000

# Display line numbers in filer.
# Values: 0, 1
# Default: 1
#
# filer_numbered = 0


# -----------------------------------------------------------------------------
# Administration
# -----------------------------------------------------------------------------

# Display admin navigation sidebar.
# Default: True
#
# admin_nav_sidebar = False


# -----------------------------------------------------------------------------
# Debug
# -----------------------------------------------------------------------------

# Activate trace of server error 500.
# Must not appear in production.
# Default: False
# debug = True



[acceptance]
# Run Bots in isolated acceptance tests mode:
# - no external communication: all I/O is from/to file system,
# - system state does not change (eg. no counters are increased, no test runs in system, etc.)

# Default: False
runacceptancetest = False



[custommenus]

# -----------------------------------------------------------------------------
# Custom menu
# -----------------------------------------------------------------------------


# It is possible to add a custom menu to the default Bots menu.
#
# 1. Menu name displayed in the Bots Monitor.
#    Default: Custom
#
#    menuname = MyMenu
#
# 2. Entries in the custom menu.
#    All "name = value" entries in this section are added to the custom menu.
#
#    Incoming = /incoming/?all
#
# 3. Menu divider lines can be added with the special value "---".
#
#    divider1 = ---
#
# Note: The sequence of entries is preserved, but the case of menu entries
# is not; title case will be applied.



[jobqueue]

# -----------------------------------------------------------------------------
# Job queue
# -----------------------------------------------------------------------------

# Enable the job queue for running bots-engine.
# Default: False
enabled = False

# Number of threads.
nr_threads = 1

# Port used by the job queue XML-RPC server (localhost).
# Default: 28082
port = 28082


# -----------------------------------------------------------------------------
# Job queue logging
# -----------------------------------------------------------------------------

# Logging is always written to a log file and optionally to the console.
log_level = INFO

# Enable console logging.
# Default: True
log_console = True

# Console logging level.
# Values: DEBUG, INFO, STARTINFO, WARNING, ERROR, CRITICAL
# Default: STARTINFO
log_console_level = STARTINFO

# Log file logging level.
# Values: DEBUG, INFO, STARTINFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_file_level = INFO

# Number of daily rotating log files.
# Default: 30
#
# log_file_number = 30


# -----------------------------------------------------------------------------
# Job authorization and timeout
# -----------------------------------------------------------------------------

# Custom authorized tasks.
#
# authorized_tasks =

# Kill jobs that exceed maxruntime.
# Default: False
killjobsintimeout = False



# =============================================================================
# Directory monitoring
# =============================================================================
#
# The bots directory monitoring tool (bots-dirmonitor) uses a separate
# section for each monitor: dirmonitor<int>. 
# Note: section dirmonitor contains the general settings for all monitors.
#
#
# Example:
#
# [dirmonitor]
# # General settings for directory monitoring
#
# [dirmonitor1]
# # Directory to watch. A path (without a filename or wildcard) specifies a directory.
# #
# # If a filename/wildcard is specified in path, only that file/those files
# # are watched. This is useful when using one file as a message queue;
# # an event is fired when the file is appended. No default is available.
# path = c:/edi/outbound/invoice
#
# # File mask for files in this directory.
# # Default: '*'
# filemask = *.xml
#
# # Route to run when an event is detected.
# # Default: '' (no route, just run bots-engine)
# route = myfirstroute
#
# # Watch recursively.
# # Note: only file events are monitored.
# # Default: False
# recursive = False
#
# [dirmonitor2]
# path = c:/edi/outbound/asn
# # Other parameters use their defaults.



[dirmonitor]

# -----------------------------------------------------------------------------
# General directory monitoring
# -----------------------------------------------------------------------------

# Launch routes of monitored directories to process files found when
# dirmonitor starts.
process_existing = True


# -----------------------------------------------------------------------------
# Directory monitor logging
# -----------------------------------------------------------------------------

# Logging is always written to a log file and optionally to the console.
log_level = INFO

# Enable console logging.
# Default: True
log_console = True

# Console logging level.
# Values: DEBUG, INFO, STARTINFO, WARNING, ERROR, CRITICAL
# Default: STARTINFO
log_console_level = STARTINFO

# Log file logging level.
# Values: DEBUG, INFO, STARTINFO, WARNING, ERROR, CRITICAL
# Default: INFO
log_file_level = INFO

# Number of daily rotating log files.
# Default: 30
#
# log_file_number = 30


[dirmonitor1]

# path = C:/Users/hje/Documents/Bots/botsdev/bots/botssys/infile/stress06/xml
# path = /home/hje/Bots/botsdev/bots/botssys/infile/stress06/xml
# recursive = False
# filemask = *.xml
# route =


[dirmonitor2]

# path = C:/Users/hje/Documents/Bots/botsdev/bots/botssys/infile/stress06/xml2
# path = /home/hje/Bots/botsdev/bots/botssys/infile/stress06/xml2
# recursive = True
# filemask = *.xml
# route =



[directories]

# -----------------------------------------------------------------------------
# Directories / pathnames
# -----------------------------------------------------------------------------

# Directories/pathnames where Bots expects files.
#
# Do not use backslashes/double slashes/double backslashes.
# Pathnames should NOT have a trailing slash.


# Internal storage of files, database, archive, etc. (spool).
# Default: botssys
botssys = botssys

# User script files, grammars, mappings, etc.
# Default: usersys
usersys = usersys

# Directory for configuration files is set with command-line parameter '-c',
# for example: -cconfig
#
# By setting usersys/botssys and config (as a command-line parameter), you can
# easily set up different environments (test/production).
#
# On *nix systems, if you just want another location for these directories,
# you can use a symbolic link.


# Other directory settings:
#
#   SQLite DB: set path to SQLite database in config/settings.py
#   archive:   set in channel
#   infile:    plugins place test EDI files here; set in channel
#   outfile:   plugins place translation results here; set in channel



[charsets]

# -----------------------------------------------------------------------------
# Character-set aliases
# -----------------------------------------------------------------------------

# Aliases to some EDIFACT character sets.
# latin_1 is ISO-8859-1
unoc = latin_1
unod = iso8859_2
unoe = iso8859_5
unof = iso8859_7
unog = iso8859_3
unoh = iso8859_4
unoi = iso8859_6
unoj = iso8859_8
unok = iso8859_9
unow = utf_8

# UNOX is defined as:
# Code extension technique as defined by ISO 2022, using the escape
# techniques in accordance with ISO 2375.
unox = iso2022_jp

unoy = utf_8
keca = euc_kr
