{% if form and form.refresh and form.refresh.value %}{% with refresh=form.refresh.value %}
<script type="text/javascript">
$(document).ready(function() {
    setTimeout(function() {
        if (document.getElementById('id_refresh').value) {
            /* the form of the view; not the first form of the page: that is the form to log out */
            document.getElementById('id_refresh').form.submit();
        }
    }, {{ refresh }}*1000);
});
</script>{% endwith %}{% endif %}
