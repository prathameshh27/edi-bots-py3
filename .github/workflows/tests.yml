# Tests on every push and pull request: unit tests, the regression suite (42 official plugins) and the package.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[testing,tools]"
      - run: python -m pytest tests/unit -q

  regression:
    # the 42 official plugins against the stored results of bots 3.2.0, and the channel tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[testing,tools]"
      - run: python -m pytest tests/regression -n 4 -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m pip install "$(ls dist/*.whl)[bots3]"
      - run: bots-portenv --help || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
