[project]
name = "bots-ediint"
dynamic = ["version"]
description = "attr: bots.__about__.__summary__"
authors = [
    {name = "attr: bots.__about__.__author__", email = "attr: bots.__about__.__email__"},
]
dependencies = [
    "Cherrypy",
    "Django>=4,<7",
    "cheroot!=11.0.*,!=11.1.1",
    "lxml",
    "pywin32; sys_platform == 'win32'",
    "pyinotify; sys_platform == 'linux' or sys_platform == 'linux2'",
    "pyasyncore; sys_platform == 'linux' or sys_platform == 'linux2'",
    "defusedxml>=0.7.1",
]
requires-python = ">=3.10, <4"
readme = "README.rst"
license = {text = "GNU General Public License (GPL v3.0)"}
keywords = [
    "edi edifact x12 tradacoms xml fixedfile csv json",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial",
    "Topic :: Other/Nonlisted Topic",
]

[project.urls]
Homepage = "attr: bots.__about__.__url__"
"Bug Reports" = "https://gitlab.com/bots-ediint/bots/issues"

[project.optional-dependencies]
# editype excel (incoming): .xlsx and .xls
excel = [
    "openpyxl",
    "xlrd>=2.0",
]
# preprocessing extractpdf
pdf = [
    "pdfminer.six",
]
# bots-portusersys: convert user scripts of bots 3 (python 2) to python 3
port = [
    "fissix",
]
# channels http and https
http = [
    "requests",
]
# channels sftp
sftp = [
    "paramiko>=2",
]
# editype templatehtml with genshi templates
templatehtml = [
    "Genshi",
]
# database of bots, or of communication scripts that "import MySQLdb"
mysql = [
    "mysqlclient",
]
postgresql = [
    "psycopg",
]
# database of bots, or channels of type db, on Microsoft SQL Server
mssql = [
    "mssql-django>=1.6",
]
# what an installation that comes from bots 3 usually needs (the conversion tools included)
bots3 = [
    "fissix",
    "Genshi",
    "paramiko>=2",
    "requests",
    "openpyxl",
    "xlrd>=2.0",
    "pdfminer.six",
]
tools = [
    "Genshi",         # for using templates/mapping to HTML)
    "paramiko>=2",    # SFTP
    "pdfminer.six",   # parse pdf-files
    "xlrd>=2.0",      # parse excel-files (.xls)
    "openpyxl",       # parse excel-files (.xlsx)
]
testing = [
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-xdist",
    # tests that are skipped when these are not installed
    "fissix",         # tests/unit/test_portusersys.py
    "pyftpdlib",      # ftp server for tests/regression/test_ftp.py
    "requests",       # tests/regression/test_http.py, test_tls.py
    "pyopenssl",      # ftps server for tests/regression/test_tls.py
    "paramiko>=2",    # tests/unit/test_channel_security.py
    "openpyxl",
    "xlrd>=2.0",
    "pdfminer.six",
]

[project.scripts]
bots-configure = "bots.configure:start"
bots-dirmonitor = "bots.dirmonitor:start"
bots-engine = "bots.engine:start"
bots-engine2 = "bots.engine2:start"
bots-grammarcheck = "bots.grammarcheck:start"
bots-job2queue = "bots.job2queue:start"
bots-jobqueueserver = "bots.jobqueueserver:start"
bots-updatedb = "bots.botsupdatedb:start"
bots-portusersys = "bots.portusersys:start"
bots-checkusersys = "bots.portusersys:start_check"
bots-portconfig = "bots.portconfig:start"
bots-portenv = "bots.portenv:start"
bots-webserver = "bots.webserver:start"
bots-xml2botsgrammar = "bots.xml2botsgrammar:start"
bots-plugoutindex = "bots.plugmanager:plugoutindex"
bots-index2json = "bots.plugmanager:index2json"


[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "."
includes = ["bots"]
excludes = ["bots/botssys", "bots/config", "tests", "*.po"]

[tool.pdm.version]
source = "scm"
version_format = "scripts.bots_packaging:format_version"
fallback_version = "4.0.0"


[tool.black]
line-length = 120
target-version = ["py310"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
# tests/unit/        unit tests; run on a private, temporary bots environment (see tests/unit/conftest.py)
# tests/regression/  the official plugins, compared with the stored results of bots 3.2.0
# tests/legacy/      the bots 3 unit test scripts; not ported yet, not collected
testpaths = [
    "tests/unit",
    "tests/regression",
]
python_files = [
    "test_*.py",
]
